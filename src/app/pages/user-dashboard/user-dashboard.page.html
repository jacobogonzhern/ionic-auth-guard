<ion-header [translucent]="true">
  <ion-toolbar color="tertiary">
    <ion-title>Panel de Operador</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="handleLogout()">Cerrar Sesión</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card color="light">
    <ion-card-header>
      <ion-card-title>Hola, {{ currentSession()?.username }}</ion-card-title>
      <ion-card-subtitle>Rol: {{ currentSession()?.role }}</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <p>Estás en el panel de usuario. No tienes permisos para acceder a <code>/admin</code>.</p>
      <p>Si intentas entrar escribiendo la URL, <code>roleGuard</code> te redirigirá aquí.</p>
    </ion-card-content>
  </ion-card>
</ion-content>
